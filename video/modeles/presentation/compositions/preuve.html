<template>
  <style>
    @font-face { font-family: "DIN Etrave"; src: url("assets/fonts/din-alternate-bold.ttf") format("truetype"); font-weight: 700; }
    #root { position: absolute; inset: 0; font-family: "DIN Etrave", sans-serif; color: #18222e; }
    /* le certificat réel, posé sur la carte avec son ombre de contact */
    #pr-cert { position: absolute; left: 120px; top: 460px; width: 840px; height: 1192px; border-radius: 22px;
               box-shadow: 0 18px 40px rgba(24, 34, 46, 0.18); overflow: hidden; }
    #pr-cert img { display: block; width: 100%; height: 100%; }
    /* le montant, chiffre par chiffre : chaque chiffre est une colonne qui roule */
    #pr-montant { position: absolute; left: 120px; top: 190px; height: 132px; font-size: 132px; line-height: 132px; display: flex; white-space: pre; }
    .pr-col { display: inline-block; height: 132px; overflow: hidden; }
    .pr-bande { display: block; }
    .pr-bande span { display: block; height: 132px; }
    .pr-sep { display: inline-block; }
    #pr-label { position: absolute; left: 124px; top: 345px; font-size: 50px; color: #46546a; }
    #pr-nom { position: absolute; left: 120px; top: 470px; font-size: 120px; line-height: 1; }
    #pr-depuis { position: absolute; left: 124px; top: 612px; font-size: 64px; color: #46546a; }
    #pr-six { position: absolute; left: 120px; top: 690px; font-size: 220px; line-height: 1; }
    #pr-ans { position: absolute; left: 272px; top: 690px; font-size: 220px; line-height: 1; }
  </style>
  <div id="root" data-composition-id="preuve" data-width="1080" data-height="1920">
    <div id="pr-cert"><img src="assets/certificat.png" alt="{{ALT_CERTIFICAT}}" /></div>
    <div id="pr-montant" aria-label="{{MONTANT}}">
      {{MONTANT_COLONNES}}
    </div>
    <div id="pr-label">{{LIBELLE_MONTANT}}</div>
    <div id="pr-nom">{{NOM}},</div>
    <div id="pr-depuis">trader depuis</div>
    <div id="pr-six">{{ANNEES}}</div>
    <div id="pr-ans">ans</div>
  </div>
  <script>
    // colonnes du compteur : 0 à 9 deux fois, la bande s'arrête sur le chiffre du certificat au second tour
    document.querySelectorAll("#pr-montant .pr-col").forEach((col) => {
      const bande = document.createElement("span");
      bande.className = "pr-bande";
      bande.setAttribute("data-layout-ignore", "");   // chiffres qui défilent : seul le chiffre final se lit
      for (let tour = 0; tour < 2; tour++) for (let c = 0; c <= 9; c++) { const s = document.createElement("span"); s.textContent = String(c); bande.appendChild(s); }
      col.appendChild(bande);
    });
    const tl = gsap.timeline({ paused: true });
    // 2a : le certificat tombe et se pose (le champ bleu de la scène 1 finit de se soulever au même moment)
    tl.fromTo("#pr-cert", { y: -1750, rotation: -7 }, { y: 0, rotation: -2, duration: 0.55, ease: "back.out(1.3)" }, 0.5);
    tl.fromTo("#pr-cert", { scale: 1 }, { scale: 1.05, duration: 1.3, ease: "power2.inOut", transformOrigin: "50% 62%" }, 1.1);
    // 2b : le montant roule, chiffre par chiffre, au-dessus du certificat
    tl.fromTo("#pr-montant", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 1.6);
    document.querySelectorAll("#pr-montant .pr-col").forEach((col, i) => {
      const c = Number(col.dataset.chiffre);
      tl.fromTo(col.querySelector(".pr-bande"), { y: 0 }, { y: -(10 + c) * 132, duration: 0.9, ease: "power3.out" }, 1.6 + i * 0.05);
    });
    tl.fromTo("#pr-label", { clipPath: "inset(-30% 100% -40% 0)" }, { clipPath: "inset(-30% 0% -40% 0)", duration: 0.35, ease: "power3.out" }, 1.9);
    // 2c : le certificat glisse hors champ, le nom arrive
    tl.to(["#pr-montant", "#pr-label"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.95);
    tl.to("#pr-cert", { y: 1750, rotation: 3, duration: 0.45, ease: "power2.in" }, 2.9);
    tl.fromTo("#pr-nom", { clipPath: "inset(-30% 100% -40% 0)" }, { clipPath: "inset(-30% 0% -40% 0)", duration: 0.3, ease: "power3.out" }, 3.2);
    tl.fromTo("#pr-depuis", { clipPath: "inset(-30% 100% -40% 0)" }, { clipPath: "inset(-30% 0% -40% 0)", duration: 0.3, ease: "power3.out" }, 3.33);
    tl.fromTo(["#pr-six", "#pr-ans"], { clipPath: "inset(-30% 100% -40% 0)" }, { clipPath: "inset(-30% 0% -40% 0)", duration: 0.3, ease: "power3.out", stagger: 0.1 }, 5.1);
    // relais : tout part sauf le « 6 », qui monte là où la scène suivante écrit « 15:30 »
    tl.to(["#pr-nom", "#pr-depuis", "#pr-ans"], { opacity: 0, duration: 0.2, ease: "power2.in" }, 6.1);
    tl.to("#pr-six", { y: -390, duration: 0.3, ease: "power3.inOut" }, 6.1);
    window.__timelines["preuve"] = tl;
  </script>
</template>
