    <style>
      /* Étrave, la carte marine : papier, encre, bleu du logo ; le magenta est réservé à l'aiguille de la frise. */
      @font-face { font-family: "DIN Etrave"; src: url("assets/fonts/din-alternate-bold.ttf") format("truetype"); font-weight: 700; }
      :root {
        --papier: #f6f8fa;
        --eau: #e2edf5;
        --eau-2: #c5dbec;
        --grille: #dde4ea;
        --axe: #94a3b2;
        --encre: #18222e;
        --encre-2: #46546a;
        --bleu: #2f7bd9;
        --magenta: #b4307e;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--papier); }
      #root { position: relative; width: 100%; height: 100%; font-family: "DIN Etrave", sans-serif; }
      /* le fond de carte, sous toutes les scènes : papier et quadrillage */
      #fond {
        position: absolute; inset: 0; background-color: var(--papier);
        background-image: linear-gradient(var(--grille) 2px, transparent 2px), linear-gradient(90deg, var(--grille) 2px, transparent 2px);
        background-size: 90px 90px; background-position: 42px 40px;
      }
    </style>
  </head>
